<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  font-family: 'Montserrat', sans-serif;
  text-align: center;
}

.container {
  width: 360px;
  padding: 30px;
  border-radius: 25px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 36px;
  color: #c9184a;
  margin-bottom: 20px;
}

.circle-img {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
}

.circle-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

p {
  font-size: 17px;
  line-height: 1.8;
  color: #4a0d23;
  margin-bottom: 25px;
}

button {
  padding: 14px 30px;
  font-size: 18px;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  background: #ff4d6d;
  color: #fff;
  font-weight: 600;
}

button:hover {
  transform: scale(1.08);
}
</style>
</head>

<body>

<div class="container">
  <h1>💖 Mine Baby 💖</h1>

  <div class="circle-img">
    <img src="photo.jpg">
  </div>

  <p>
    I Can’t Wait For All The Small Moments With You —  
    Morning Coffee,Lazy Sundays,Silly Talks  
    And Quiet Nights.  
    Every Day Feels Brighter Because of You.
  </p>

  <button onclick="window.location.href='love.html'">
    Thangoo Click Here!
  </button>
</div>

</body>
</html>
